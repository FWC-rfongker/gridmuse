<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vinyl Room</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090b;color:#f5f5f7;font:16px system-ui}p{opacity:.65}</style>
<p>กำลังเปิด Vinyl Room…</p>
<script>
(async()=>{try{const e=(await fetch("app.gz.b64")).text(),b=Uint8Array.from(atob((await e).replace(/\s/g,"")),c=>c.charCodeAt(0)),s=new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"));document.open();document.write(await new Response(s).text());document.close()}catch(x){document.body.innerHTML="<p>เปิด Vinyl Room ไม่สำเร็จ กรุณารีเฟรชหน้าอีกครั้ง</p>"}})();
</script>
