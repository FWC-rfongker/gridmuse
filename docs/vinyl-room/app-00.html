<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinyl Room</title>
<style>
@property --a1{syntax:'<color>';inherits:true;initial-value:#1f7fa0}
@property --a2{syntax:'<color>';inherits:true;initial-value:#b6e8f2}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--S:min(68vw,46vh,430px);--tx:#f5f5f7;--tx2:rgba(245,245,247,.58);--gl:rgba(255,255,255,.08);--glb:rgba(255,255,255,.15)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:#09090b;color:var(--tx);font-family:-apple-system,"SF Pro Display","Inter","Segoe UI",system-ui,"Noto Sans Thai",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:68px 0 20px;overflow-x:hidden}
.amb{position:fixed;inset:-25%;z-index:-2;background:radial-gradient(38% 38% at 28% 35%,var(--a1),transparent 72%),radial-gradient(42% 42% at 76% 66%,var(--a2),transparent 72%);filter:blur(70px) saturate(1.5);opacity:.6;transition:--a1 1.1s,--a2 1.1s}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 35%,rgba(9,9,11,.88))}
header{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:24px;font-weight:600;font-size:16px;display:flex;gap:10px;align-items:center}
header i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#09090b 0 17%,#e6e6ea 18% 30%,#1b1b1f 31%);box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
.stage{position:relative;width:calc(var(--S)*1.32);height:calc(var(--S)*1.1);margin-left:calc(var(--S)*.2)}
.sleeve{position:absolute;left:calc(var(--S)*-.34);top:calc(var(--S)*.1);width:calc(var(--S)*.85);aspect-ratio:1;transform:rotate(-6deg);border-radius:6px;overflow:hidden;box-shadow:0 28px 54px rgba(0,0,0,.65)}
.sleeve svg,.label svg{display:block;width:100%;height:100%}
.disc{position:absolute;left:calc(var(--S)*.06);top:calc(var(--S)*.05);width:var(--S);height:var(--S);border-radius:50%;box-shadow:-16px 14px 40px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:conic-gradient(from 25deg,transparent 0 6%,rgba(255,255,255,.22) 12%,transparent 20% 50%,rgba(255,255,255,.16) 62%,transparent 72%)}
.spin{position:absolute;inset:0;border-radius:50%;background:#0b0b0d;overflow:hidden;box-shadow:inset 0 0 0 2px #26262c,inset 0 0 0 10px #09090b}
.ring{position:absolute;inset:0;border-radius:50%;opacity:.62;-webkit-mask:radial-gradient(circle,transparent 0 33%,#000 36% 94%,transparent 96%);mask:radial-gradient(circle,transparent 0 33%,#000 36% 94%,transparent 96%)}
[data-tex=swirl] .ring{background:conic-gradient(var(--c1),var(--c2),var(--c1),var(--c2),var(--c1));filter:blur(16px) saturate(1.6)}
[data-tex=yolk] .ring{background:var(--c1)}
[data-tex=split] .ring{background:conic-gradient(var(--c1) 0 50%,var(--c2) 50% 100%)}
[data-tex=classic] .ring{display:none}
.gr{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,rgba(0,0,0,.4) 0 1px,transparent 1px 2.6px)}
.label{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #0b0b0d,inset 0 0 0 1px rgba(255,255,255,.25)}
.hole,.ring,.gr{pointer-events:none}
.hole{position:absolute;left:48.6%;top:48.6%;width:2.8%;height:2.8%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#8e8e96);box-shadow:0 0 0 2px rgba(0,0,0,.5);z-index:3}
.arm{position:absolute;left:calc(var(--S)*1.16);top:calc(var(--S)*.13);width:0;height:0;transform-origin:0 0;cursor:pointer;filter:drop-shadow(8px 12px 9px rgba(0,0,0,.55));z-index:5}
.arm b{position:absolute;display:block}
.bar{left:-3px;top:calc(var(--S)*-.07);width:6px;height:calc(var(--S)*.77);border-radius:3px;background:linear-gradient(90deg,#8d8d93,#f4f4f6,#7b7b82)}
.head{left:-10px;top:calc(var(--S)*.68);width:20px;height:34px;border-radius:3px 3px 8px 8px;background:#18181b;box-shadow:inset 0 -6px 0 #d4af5a}
.cw{left:-13px;top:calc(var(--S)*-.14);width:26px;height:32px;border-radius:6px;background:linear-gradient(90deg,#27272b,#5a5a60,#202024)}
.base{position:absolute;left:calc(var(--S)*1.16 - 30px);top:calc(var(--S)*.13 - 30px);width:60px;height:60px;border:0;padding:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4f4f6,#8e8e96 62%,#55555b);box-shadow:0 6px 14px rgba(0,0,0,.55);cursor:pointer;z-index:4}
.base::after{content:"";position:absolute;inset:38%;border-radius:50%;background:#2a2a2e}
.meta{text-align:center;padding:0 16px}
.meta h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
.meta p{margin:4px 0 0;color:var(--tx2);font-size:14px}
.prog{width:min(360px,80vw);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
.pbar{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.18);cursor:pointer;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--tx);width:0}
.ctrl{display:flex;gap:18px;align-items:center}
.ctrl button{display:grid;place-items:center;border:1px solid var(--glb);border-radius:50%;width:48px;height:48px;color:#fff;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.ctrl button.big{width:66px;height:66px}
.ctrl svg{width:22px;height:22px;fill:currentColor}.big svg{width:28px;height:28px}
.ctrl button:active{transform:scale(.95)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tex{display:flex;gap:8px}
.tex button{border:1px solid var(--glb);background:var(--gl);color:var(--tx2);border-radius:999px;padding:6px 14px;font:500 12px inherit;font-family:inherit;cursor:pointer}
.tex button[aria-pressed=true]{background:var(--tx);color:#111;border-color:var(--tx)}
.shelf{display:flex;gap:12px;overflow-x:auto;max-width:min(94vw,680px);padding:10px 8px 14px;scrollbar-width:none}
.shelf button{flex:0 0 auto;width:70px;border:0;padding:0;background:none;color:var(--tx);cursor:pointer;opacity:.55;transition:transform .25s,opacity .25s;font:inherit;font-size:11px;text-align:left}
.shelf button svg{display:block;width:70px;height:70px;border-radius:5px;box-shadow:0 8px 16px rgba(0,0,0,.5);margin-bottom:6px}
.shelf button[aria-current=true]{opacity:1;transform:translateY(-8px)}
.shelf span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{color:rgba(245,245,247,.4);font-size:12px;text-align:center;padding:0 16px}
#lart{width:100%;height:100%}
.yw{position:absolute;inset:0;display:none;overflow:hidden;border-radius:50%;background:#111}
